<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbetsblad</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; background: #f5f5f5; }
  header { background: #2c3e50; color: #fff; padding: .75rem 1rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; box-shadow: 0 2px 4px rgba(0,0,0,.1); }
  h1 { font-size: 1.35rem; font-weight: 600; }
  .controls { display: flex; gap: .5rem; flex-wrap: wrap; }
  button { padding: .5rem .9rem; border: none; border-radius: 4px; cursor: pointer; font-size: .88rem; font-weight: 500; color: #fff; background: #95a5a6; transition: background .2s; }
  button:hover { background: #7f8c8d; }
  .btn-primary { background: #3498db; } .btn-primary:hover { background: #2980b9; }
  .toggle { display: flex; align-items: center; gap: .4rem; font-size: .88rem; cursor: pointer; margin-right: .5rem; user-select: none; }
  .toggle input { width: 1rem; height: 1rem; cursor: pointer; }
  .panel[hidden] { display: none; }
  .btn-lang { background: #34495e; min-width: 46px; } .btn-lang:hover { background: #22313f; }
  main { flex: 1; display: flex; overflow: hidden; }
  .panel { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #fff; border-right: 1px solid #ddd; }
  .panel:last-child { border-right: none; flex: 1.25; }
  .panel-head { padding: .6rem 1rem; background: #ecf0f1; border-bottom: 1px solid #ddd; font-weight: 600; color: #2c3e50; display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
  .panel-head .mini { display: flex; gap: .35rem; }
  .panel-head button { padding: .25rem .6rem; font-size: .78rem; background: #bdc3c7; color: #2c3e50; }
  .panel-head button:hover { background: #a7b0b5; }
  .editor { flex: 1; display: flex; overflow: hidden; }
  .lines { background: #f8f9fa; color: #999; padding: 1rem .5rem; text-align: right; font: .85rem/1.5 Monaco, Menlo, 'Courier New', monospace; user-select: none; border-right: 1px solid #e0e0e0; overflow: hidden; min-width: 3rem; white-space: pre; }
  textarea { flex: 1; border: none; padding: 1rem; font: .85rem/1.5 Monaco, Menlo, 'Courier New', monospace; resize: none; outline: none; white-space: pre; overflow: auto; tab-size: 2; }
  #paste { white-space: pre-wrap; }
  .status { padding: .45rem 1rem; font-size: .8rem; border-top: 1px solid #ddd; background: #fafafa; color: #555; min-height: 2rem; }
  .status.err { background: #fdecea; color: #b3261e; }
  iframe { flex: 1; border: none; background: #fff; }
  .note { font-size: .75rem; font-weight: 400; color: #7f8c8d; }
  @media (max-width: 900px) { main { flex-direction: column; overflow: auto; } .panel { min-height: 50vh; border-right: none; border-bottom: 1px solid #ddd; } }
</style>
</head>
<body>
<header>
  <h1 id="t_title">Formulärutskrift</h1>
  <div class="controls">
    <label class="toggle"><input type="checkbox" id="showSettings"> <span id="t_showSettings">Visa inställningar</span></label>
    <button class="btn-lang" id="langBtn">EN</button>
    <button id="exampleBtn">Exempel</button>
    <button id="saveHtmlBtn">Spara HTML</button>
    <button class="btn-primary" id="printBtn">Skriv ut</button>
  </div>
</header>

<main>
  <div class="panel" id="settingsPanel" hidden>
    <div class="panel-head"><span id="t_settings">Inställningar (YAML)</span>
      <span class="mini">
        <button id="importBtn">Importera</button>
        <button id="exportBtn">Exportera</button>
        <button id="shareBtn">Kopiera länk</button>
      </span>
    </div>
    <div class="editor">
      <div class="lines" id="lines">1</div>
      <textarea id="settings" spellcheck="false"></textarea>
    </div>
    <div class="status" id="settingsStatus"></div>
    <input type="file" id="fileInput" accept=".yaml,.yml,.txt" hidden>
  </div>

  <div class="panel">
    <div class="panel-head"><span id="t_paste">Formulärsvar</span>
      <span class="mini"><button id="clearBtn">Rensa</button></span>
    </div>
    <div class="editor">
      <textarea id="paste" spellcheck="false"></textarea>
    </div>
    <div class="status" id="pasteStatus"></div>
  </div>

  <div class="panel">
    <div class="panel-head"><span id="t_preview">Förhandsgranskning</span><span class="note" id="t_privacy">Svaren sparas aldrig</span></div>
    <iframe id="preview" title="preview"></iframe>
  </div>
</main>

const EXAMPLE_SETTINGS = `# ---------- 1. Allmänt ----------
title: Hälsoenkät GYMN åk 1
checkboxes: [FV, Journal, HD, Vaccin, Tele]
blanks: [Klass, Elev]
footer_date: true          # utskriftsdatum längst ned
show_numbers: true         # visa frågenummer framför ifyllda svar

hide_in_groups: [Nej]      # i fält med flera frågor: utelämna dessa svar (om de inte flaggas)
legend: true               # förklaring av färgerna längst ned

colors:

  flagged: "#b4483a"             # flaggade svar: text, prick och understrykning
  flagged_background: "#fbebe6"  # flaggade svar: bakgrund

texts:

sections:

      - ["Frånvaro", "Framtidsdrömmar"]

  - title: Relationer

  - title: Kost

  - title: Fysisk aktivitet/stillasittande

  - title: ANDT

  - title: Upplevd hälsa/kroppen

/* ---------- Helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').toLowerCase().replace(/\s+/g, ' ').trim();
const normId = s => norm(s).replace(/[.\s]+/g, '');      // "12 a." -> "12a"
const asList = v => v == null ? [] : Array.isArray(v) ? v : [v];

function toRegex(p) {
  const m = /^\/(.*)\/([a-z]*)$/s.exec(String(p));
  if (!m) return null;
  try { return new RegExp(m[1], m[2].includes('i') ? m[2] : m[2] + 'i'); } catch { return null; }
}

// Match a question pattern: number ("12 a"), /regex/, or substring
function questionMatches(pattern, item) {
  const p = String(pattern).trim();
  const re = toRegex(p);
  if (re) return re.test(item.question);
  if (/^\d+\s*[a-zåäö]?\.?$/i.test(p)) return item.id !== null && item.id === normId(p);
  return norm(item.question).includes(norm(p));
}

/* ---------- Parsing ---------- */
const ID_RE = /^\s*(\d+\s*[a-zåäö]?)\s*[.)]\s+/i;

function splitAnswer(raw) {
  // "Ja: Vilken aktivitet/sport utför du? innebandy" -> main "Ja", follow-up
  const m = /^([^:?]{1,60}):\s+(.+\?)\s*(.*)$/s.exec(raw);
  if (m) return { main: m[1].trim(), followQ: m[2].trim(), followA: m[3].trim() };
  return { main: raw.trim(), followQ: '', followA: '' };
}

function makeItem(question, answer) {
  question = question.trim();
  const idm = ID_RE.exec(question);
  const parts = splitAnswer(answer);
  return {
    raw: question,
    id: idm ? normId(idm[1]) : null,
    num: idm ? idm[1].replace(/\s+/g, ' ').trim() : '',
    question: idm ? question.slice(idm[0].length).trim() : question,
    answer: answer.trim(),
    ...parts,
    used: false
  };
}

function parsePaste(text, cfg) {
  const lines = text.replace(/\r/g, '').split('\n');
  const nonEmpty = lines.filter(l => l.trim());
  if (!nonEmpty.length) return { items: [], format: '-' };
  let mode = (cfg.parse && cfg.parse.mode) || 'auto';
  if (mode === 'auto') {
    const tabs = nonEmpty.filter(l => l.includes('\t')).length;
    const qs = nonEmpty.filter(l => /\?\s*$/.test(l) || ID_RE.test(l)).length;
    const colons = nonEmpty.filter(l => /:\s/.test(l)).length;
    mode = tabs >= nonEmpty.length * 0.3 ? 'tab' : qs >= 2 ? 'lines' : colons >= nonEmpty.length * 0.5 ? 'colon' : 'alternate';
  }
  const items = [];
  const append = l => { const last = items[items.length - 1]; if (last) Object.assign(last, makeItem(last.raw, last.answer + '\n' + l.trim())); };

  if (mode === 'tab') {
    for (const l of lines) {
      if (!l.trim()) continue;
      if (l.includes('\t')) {
        const [q, ...rest] = l.split('\t');
        if (!q.trim() && items.length) { append(rest.join(' ')); continue; }
        items.push(makeItem(q, rest.map(s => s.trim()).filter(Boolean).join(', ')));
      } else append(l);
    }
  } else if (mode === 'colon') {
    for (const l of lines) {
      if (!l.trim()) continue;
      const i = l.indexOf(': ');
      if (i > 0) items.push(makeItem(l.slice(0, i), l.slice(i + 2))); else append(l);
    }
  } else if (mode === 'lines') {
    // question lines (numbered or ending with "?"), followed by answer lines
    let cur = null;
    for (const l of lines) {
      if (!l.trim()) continue;
      if (ID_RE.test(l) || /\?\s*$/.test(l)) { cur = { q: l, a: [] }; items.push(cur); }
      else if (cur) cur.a.push(l.trim());
    }
    for (let i = 0; i < items.length; i++) items[i] = makeItem(items[i].q, items[i].a.join('\n'));
  } else {
    for (let i = 0; i < nonEmpty.length; i += 2) items.push(makeItem(nonEmpty[i], nonEmpty[i + 1] || ''));
  }
  return { items, format: mode };
}

/* ---------- Flagging ---------- */
// Does answer option `a` match the item? Exact (main answer, whole answer,
// or one of several comma/line separated choices), or /regex/.
function hit(a, item) {
  const re = toRegex(a);
  if (re) return re.test(item.main) || re.test(item.answer);
  const n = norm(a);
  return n === norm(item.main) || n === norm(item.answer) || item.answer.split(/\n|,\s*/).map(norm).includes(n);
}

// Number in an answer: follow-up's number if any ("Ja: Hur många…? 2" -> 2),
// otherwise the first number ("5-6 timmar" -> 5, "9" -> 9)
function numberOf(item) {
  const first = t => { const m = /-?\d+(?:[.,]\d+)?/.exec(t || ''); return m ? parseFloat(m[0].replace(',', '.')) : NaN; };
  const f = first(item.followA);
  return !isNaN(f) ? f : !isNaN(first(item.main)) ? first(item.main) : first(item.answer);
}

// questions: { "12a": { text, ok: [...], flag: [...], flag_contains, flag_unless, flag_below, flag_above } }
function questionDefs(cfg) {
  const q = cfg.questions && typeof cfg.questions === 'object' ? cfg.questions : {};
  return new Map(Object.entries(q).filter(([, d]) => d && typeof d === 'object').map(([k, d]) => [normId(k), d]));
}

function isFlagged(item, def) {
  if (!def || !item.answer.trim()) return false;
  if (def.flag != null && asList(def.flag).some(a => hit(a, item))) return true;
  if (def.flag_contains != null && asList(def.flag_contains).some(c => norm(item.answer).includes(norm(c)))) return true;
  if (def.flag_unless != null && !asList(def.flag_unless).some(a => hit(a, item))) return true;
  if (def.flag_below != null || def.flag_above != null) {
    const v = numberOf(item);
    if (!isNaN(v) && ((def.flag_below != null && v < def.flag_below) || (def.flag_above != null && v > def.flag_above))) return true;
  }
  return false;
}

/* ---------- Output ---------- */
// "Trivsel/trygghet @3 @4" -> { label: 'Trivsel/trygghet', qs: ['3','4'] }
function parsePart(p) {
  if (p == null) return { empty: true };
  if (typeof p === 'object' && !Array.isArray(p)) {
    return { label: String(p.label ?? ''), qs: asList(p.q ?? p.match).map(String), lines: +p.lines || 0 };
  }
  const s = String(p);
  if (!s.trim()) return { empty: true };
  if (s.trim() === '_') return { label: '', qs: [], lines: 0 };
  const qs = [];
  const label = s.replace(/(^|\s)@(\S+)/g, (_, sp, id) => { qs.push(id); return ''; }).trim();
  return { label, qs, lines: 0 };
}

function buildDocument(cfg, items) {
  const colors = { normal: '#1f3c88', flagged: '#b4483a', flagged_background: '#fbebe6', lines: '#a3a3a3', text: '#2b2b2b', ...(cfg.colors || {}) };
  const c = k => esc(colors[k]);
  const texts = { ...DEFAULT_TEXTS, ...(cfg.texts || {}) };
  const qdefs = questionDefs(cfg);
  const showNums = cfg.show_numbers ?? true;
  const hideList = asList(cfg.hide_in_groups ?? ['Nej']).map(String);
  const flagMissing = (cfg.flag_missing ?? true) && items.length > 0;
  const flagged = [];   // for the optional summary box
  const missing = [];   // template references found neither in paste nor in questions
  const unknown = [];   // answers not among a question's options
  const noAnswer = [];  // questions without an answer
  const seen = new Set();

  // questions in the questionnaire that are missing from the paste become empty items
  items = [...items];
  if (items.length) for (const [id, d] of qdefs) {
    if (!items.some(it => it.id === id)) items.push({ ...makeItem(`${id.replace(/^(\d+)([a-zåäö])$/, '$1 $2')}. ${d.text || ''}`, ''), virtual: true });
  }
  const findItem = pattern => items.find(it => questionMatches(pattern, it));
  const num = item => showNums && item.num ? `<sup>${esc(item.num)}</sup>` : '';

  function answerHtml(item, grouped) {
    const def = qdefs.get(item.id);
    const short = grouped && def && def.short ? String(def.short) : '';
    const pre = short ? `${esc(short)}: ` : '';
    const first = !seen.has(item);
    seen.add(item);
    if (!item.answer.trim()) {
      if (!(flagMissing && def)) return '';
      if (first) { noAnswer.push(item.num); flagged.push({ item, text: texts.not_answered }); }
      return `<span class="ans flag"><i class="dot"></i>${num(item)}${pre}${esc(texts.not_answered)}</span>`;
    }
    if (def && first) {
      const opts = [...asList(def.ok), ...asList(def.flag)];
      if (opts.length && !opts.some(a => hit(a, item))) unknown.push(`${item.num}: "${item.main}"`);
    }
    const flag = isFlagged(item, def);
    let txt = esc(item.main).replace(/\n/g, ', ');
    if (item.followQ && item.followA) txt += ` – <span class="fu" title="${esc(item.followQ)}">${esc(item.followA)}</span>`;
    if (short) {
      // in a group: "Huvudvärk: någon gång per månad", "Aktivitet: innebandy", "Könsidentitet"
      const yes = /^ja$/i.test(item.main.trim());
      if (yes && item.followA && isNaN(+item.followA)) txt = `<span class="fu" title="${esc(item.followQ)}">${esc(item.followA)}</span>`;
      else if (yes && !item.followA) txt = '';
      else txt = txt.replace(/^ja,\s*/i, '');
      txt = txt ? `${esc(short)}: ${txt}` : esc(short);
    }
    if (flag && first) flagged.push({ item, text: item.main + (item.followA ? ` (${item.followA})` : '') });
    return `<span class="ans${flag ? ' flag' : ''}">${flag ? '<i class="dot"></i>' : ''}${num(item)}${txt}</span>`;
  }

  function partHtml(raw) {
    const p = parsePart(raw);
    if (p.empty) return '<div class="part empty"></div>';
    const answers = [];
    const grouped = p.qs.length > 1;
    let hidden = 0;
    for (const q of p.qs) {
      const it = findItem(q);
      if (!it) { missing.push(q); continue; }
      it.used = true;
      // in a group, answers like "Nej" are left out unless flagged
      if (grouped && it.answer.trim() && hideList.some(a => hit(a, it)) && !isFlagged(it, qdefs.get(it.id))) {
        answerHtml(it, true); hidden++; continue;
      }
      const h = answerHtml(it, grouped);
      if (h) answers.push(h);
    }
    if (grouped && !answers.length && hidden) answers.push(`<span class="ans">${esc(String(hideList[0]))}</span>`);
    const extra = '<div class="xline"></div>'.repeat(Math.max(0, p.lines));
    const lbl = p.label ? `<span class="lbl">${esc(p.label)}</span>` : '';
    return `<div class="part">${lbl}<span class="fill">${answers.join('<span class="sep"> · </span>')}</span></div>${extra}`;
  }

  function cellHtml(c) {
    const parts = Array.isArray(c) ? c : [c];
    return `<div class="cell${parts.length > 1 ? ' multi' : ''}">${parts.map(partHtml).join('')}</div>`;
  }

  let body = '';
  for (const sec of asList(cfg.sections)) {
    if (!sec) continue;
    let rows = '';
    for (const r of asList(sec.rows)) {
      const cells = Array.isArray(r) ? r : [r];
      rows += `<div class="row${cells.length === 1 ? ' one' : ''}">${cells.map(cellHtml).join('')}</div>`;
    }
    const t = sec.title && String(sec.title).trim();
    body += `<section${sec.page_break ? ' class="pb"' : ''}>${t ? `<h2>${esc(t)}</h2>` : '<div class="gap"></div>'}${rows}</section>`;
  }

  const leftovers = items.filter(it => !it.used && (!it.virtual || flagMissing));
  if ((cfg.show_unmatched ?? true) && leftovers.length) {
    const noTemplate = !asList(cfg.sections).length;
    const rows = leftovers.map(it => `<div class="row one"><div class="cell"><div class="part"><span class="lbl q">${esc(it.question)}</span><span class="fill">${answerHtml(it)}</span></div></div></div>`).join('');
    body += `<section class="unm">${noTemplate ? '' : `<h2>${esc(texts.unmatched)}</h2>`}${rows}</section>`;
  }

  const summaryHtml = cfg.summary && flagged.length
    ? `<div class="summary"><h3>${esc(texts.summary)}</h3><ul>${flagged.map(f =>
        `<li><span class="sn">${esc(f.item.num)}</span> ${esc(f.item.question)} — <b>${esc(f.text)}</b></li>`).join('')}</ul></div>`
    : '';

  const boxes = asList(cfg.checkboxes).map(b => `<span class="cb">${esc(b)} <i></i></span>`).join(', ');
  const nb = asList(cfg.blanks).length;
  const blanks = asList(cfg.blanks).map((b, i) => `<span class="blank${i === nb - 1 ? ' grow' : ''}"><span>${esc(b)}</span><i></i></span>`).join('<span class="slash">/</span>');
  const date = (cfg.footer_date ?? true) ? `<span>${new Date().toLocaleDateString('sv-SE')}</span>` : '';
  const legend = (cfg.legend ?? true) && items.length ? `<span class="legend"><span class="ans">Svar</span> <span class="ans flag"><i class="dot"></i>${esc(texts.flagged)}</span></span>` : '';
  const footer = (date || legend) ? `<footer>${date}${legend}</footer>` : '';

  const extraCss = typeof cfg.css === 'string' ? cfg.css.replace(/<\/style/gi, '') : '';
  const html = `<!DOCTYPE html><html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(cfg.title || 'Arbetsblad')}</title><style>
@page { size: A4; margin: 14mm 15mm 14mm; }
* { box-sizing: border-box; }
html { background: #fff; }
body { margin: 0 auto; max-width: 190mm; padding: 18px 22px 28px; font: 9.8pt/1.35 Calibri, Carlito, 'Segoe UI', -apple-system, sans-serif; color: ${c('text')}; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
@media print { body { padding: 0; max-width: none; } }
.top { font-weight: 700; color: #111; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 6px; }
.top .t { margin-right: 4px; font-size: 11pt; }
.top .bar { color: ${c('lines')}; }
.cb i { display: inline-block; width: .8em; height: .8em; border: 1.2px solid #555; border-radius: 2px; vertical-align: -1px; }
.ids { display: flex; align-items: flex-end; gap: 6px; margin: 10px 0 12px; font-weight: 700; color: #111; }
.blank { display: flex; align-items: flex-end; gap: 4px; flex: 0 0 34%; }
.blank.grow { flex: 1; }
.blank i { flex: 1; border-bottom: 1px solid ${c('lines')}; height: 1.2em; }
.slash { color: ${c('lines')}; }
section { margin-top: 9px; }
section.pb { break-before: page; }
.gap { height: 10px; }
h2 { font-size: 9.8pt; margin: 0 0 2px; font-weight: 700; color: #111; letter-spacing: .01em; break-after: avoid; }
.row { display: grid; grid-template-columns: 1fr 1fr; column-gap: 8mm; break-inside: avoid; }
.row.one { grid-template-columns: 1fr; }
.cell { min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; }
.cell.multi { flex-direction: row; align-items: flex-end; gap: 0 6px; }
.cell.multi .part { flex: 1 1 auto; }
.cell.multi .part + .part::before { content: '/'; color: ${c('lines')}; margin-right: 4px; align-self: flex-end; padding-bottom: 2px; }
.part { display: flex; align-items: flex-end; gap: 5px; min-height: 1.78em; min-width: 0; }
.lbl { flex: 0 1 auto; padding-bottom: 2px; }
.lbl.q { flex: 0 1 55%; font-size: 8.8pt; color: #444; }
.fill { flex: 1 1 3em; min-width: 3em; border-bottom: 1px solid ${c('lines')}; min-height: 1.4em; padding: 0 2px 2px; font-size: 9.2pt; line-height: 1.45; }
.xline { border-bottom: 1px solid ${c('lines')}; height: 1.78em; }
.ans { color: ${c('normal')}; }
.ans.flag { color: ${c('flagged')}; font-weight: 600; background: ${c('flagged_background')}; box-shadow: inset 0 -1.5px 0 ${c('flagged')}; border-radius: 3px; padding: 0 3px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.dot { display: inline-block; width: .55em; height: .55em; border-radius: 50%; background: ${c('flagged')}; margin-right: 3px; vertical-align: .05em; }
.ans sup { font-size: 6.5pt; color: #8a8a8a; font-weight: 400; margin-right: 2px; vertical-align: 3px; }
.fu { font-style: italic; }
.sep { color: #b5b5b5; }
.summary { margin: 0 0 10px; border: 1px solid ${c('lines')}; border-radius: 5px; padding: 6px 10px; break-inside: avoid; }
.summary h3 { margin: 0 0 3px; font-size: 9.8pt; }
.summary ul { margin: 0; padding: 0; list-style: none; }
.summary li { padding: 1px 0; }
.summary b { color: ${c('flagged')}; }
.sn { color: #8a8a8a; }
.unm .part { min-height: 1.6em; }
footer { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 8pt; color: #777; break-inside: avoid; }
.legend { display: flex; gap: 12px; }
${extraCss}
</style></head><body>
<div class="top"><span class="t">${esc(cfg.title || '')}</span>${boxes ? `<span class="bar">||</span> ${boxes}` : ''}</div>
${blanks ? `<div class="ids">${blanks}</div>` : ''}
${summaryHtml}${body}${footer}
</body></html>`;
  const order = [...qdefs.keys()];
  noAnswer.sort((x, y) => order.indexOf(normId(x)) - order.indexOf(normId(y)));
  return { html, missing: items.length ? [...new Set(missing)] : [], unused: leftovers.filter(it => !it.virtual).length, unknown, noAnswer };
}

/* ---------- App ---------- */
const LS_SETTINGS = 'formprint.settings.v3';
// Saved settings are only kept if the user actually edited them; unedited
// settings always follow the built-in example, so app updates show up.
const LS_EDITED = 'formprint.settings.edited';
const LS_LANG = 'formprint.lang';
const $ = id => document.getElementById(id);
const els = { settings: $('settings'), paste: $('paste'), lines: $('lines'), preview: $('preview'),
  sStatus: $('settingsStatus'), pStatus: $('pasteStatus'), fileInput: $('fileInput') };
let lastGoodCfg = {};
let lastHtml = '';
let lang = 'sv';
let timer = null;

const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
};

function b64enc(str) { return btoa(String.fromCharCode(...new TextEncoder().encode(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64dec(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0))); }

function updateLines() {
  const n = els.settings.value.split('\n').length;
  els.lines.textContent = Array.from({ length: n }, (_, i) => i + 1).join('\n');
  els.lines.scrollTop = els.settings.scrollTop;
}

function render() {
  const s = STRINGS[lang];
  let cfgErr = null;
  try {
    const cfg = jsyaml.load(els.settings.value) || {};
    if (typeof cfg !== 'object' || Array.isArray(cfg)) throw new Error('Toppnivån måste vara nyckel: värde');
    lastGoodCfg = cfg;
    store.set(LS_SETTINGS, els.settings.value);
    store.set(LS_EDITED, els.settings.value === EXAMPLE_SETTINGS ? '0' : '1');
  } catch (e) { cfgErr = e; }

  if (cfgErr) { els.sStatus.className = 'status err'; els.sStatus.textContent = `${s.yamlErr} ${cfgErr.message.split('\n')[0]}`; }
  else { els.sStatus.className = 'status'; els.sStatus.textContent = s.yamlOk; }

  const { items, format } = parsePaste(els.paste.value, lastGoodCfg);
  const doc = buildDocument(lastGoodCfg, items);
  lastHtml = doc.html;
  els.preview.srcdoc = doc.html;

  if (!items.length) els.pStatus.textContent = s.empty;
  else {
    const parts = [s.parsed(items.length, format)];
    if (doc.missing.length) parts.push(s.missing(doc.missing));
    if (!Object.keys(lastGoodCfg.questions || {}).length) parts.push(s.noQuestions);
    if (doc.unknown.length) parts.push(s.unknown(doc.unknown));
    if (doc.noAnswer.length) parts.push(s.noAnswer(doc.noAnswer));
    if (doc.unused && asList(lastGoodCfg.sections).length) parts.push(s.unused(doc.unused));
    els.pStatus.textContent = parts.join(' ');
  }
}
const schedule = () => { clearTimeout(timer); timer = setTimeout(render, 200); };

function download(name, content, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function flash(btn, text) {
  const orig = btn.textContent; btn.textContent = text;
  setTimeout(() => { btn.textContent = orig; }, 1800);
}

function applyLang() {
  const s = STRINGS[lang];
  document.documentElement.lang = lang;
  const map = { t_title: 'title', exampleBtn: 'example', saveHtmlBtn: 'saveHtml', printBtn: 'print', t_settings: 'settings',
    importBtn: 'import', exportBtn: 'export', shareBtn: 'share', t_paste: 'paste', clearBtn: 'clear', t_preview: 'preview',
    t_privacy: 'privacy', langBtn: 'langBtn', t_showSettings: 'showSettings' };
  for (const [id, key] of Object.entries(map)) $(id).textContent = s[key];
  els.paste.placeholder = s.pastePh;
  document.title = s.title;
  store.set(LS_LANG, lang);
  render();
}

function init() {
  lang = store.get(LS_LANG) || 'sv';
  // Settings priority: link (#s=…) > saved in browser > example
  const m = /[#&]s=([^&]+)/.exec(location.hash);
  let initial = null;
  if (m) { try { initial = b64dec(m[1]); } catch {} history.replaceState(null, '', location.pathname + location.search); }
  const saved = store.get(LS_EDITED) === '1' ? store.get(LS_SETTINGS) : null;
  els.settings.value = initial ?? saved ?? EXAMPLE_SETTINGS;
  updateLines();

  els.settings.addEventListener('input', () => { updateLines(); schedule(); });
  els.settings.addEventListener('scroll', () => { els.lines.scrollTop = els.settings.scrollTop; });
  els.settings.addEventListener('keydown', e => {
    const t = els.settings, st = t.selectionStart, en = t.selectionEnd, v = t.value;
    if (e.key === 'Tab') {
      e.preventDefault();
      t.value = v.slice(0, st) + '  ' + v.slice(en);
      t.selectionStart = t.selectionEnd = st + 2;
      updateLines(); schedule();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const line = v.slice(v.lastIndexOf('\n', st - 1) + 1, st);
      let indent = /^\s*/.exec(line)[0];
      if (/:\s*$/.test(line)) indent += '  ';
      else if (/^\s*- /.test(line) && /^\s*- .+/.test(line)) indent = indent; // keep
      t.value = v.slice(0, st) + '\n' + indent + v.slice(en);
      t.selectionStart = t.selectionEnd = st + 1 + indent.length;
      updateLines(); schedule();
    }
  });
  els.paste.addEventListener('input', schedule);

  $('clearBtn').onclick = () => { els.paste.value = ''; render(); els.paste.focus(); };
  $('showSettings').onchange = e => { $('settingsPanel').hidden = !e.target.checked; };
  $('exampleBtn').onclick = () => {
    if ((els.paste.value.trim() || els.settings.value !== EXAMPLE_SETTINGS) && !confirm(STRINGS[lang].confirmExample)) return;
    els.settings.value = EXAMPLE_SETTINGS; els.paste.value = EXAMPLE_PASTE; updateLines(); render();
  };
  $('printBtn').onclick = () => { render(); setTimeout(() => els.preview.contentWindow.print(), 150); };
  $('saveHtmlBtn').onclick = () => download(`${(lastGoodCfg.title || 'formular').replace(/[^\wåäöÅÄÖ -]+/g, '').trim() || 'formular'}.html`, lastHtml, 'text/html');
  $('exportBtn').onclick = () => download('installningar.yaml', els.settings.value, 'text/yaml');
  $('importBtn').onclick = () => els.fileInput.click();
  els.fileInput.onchange = async () => {
    const f = els.fileInput.files[0]; if (!f) return;
    els.settings.value = await f.text(); els.fileInput.value = '';
    updateLines(); render();
  };
  $('shareBtn').onclick = () => {
    const url = location.href.split('#')[0] + '#s=' + b64enc(els.settings.value);
    navigator.clipboard.writeText(url).then(() => flash($('shareBtn'), STRINGS[lang].copied));
  };
  $('langBtn').onclick = () => { lang = lang === 'sv' ? 'en' : 'sv'; applyLang(); };

  applyLang();
}
init();
</script>
</body>
</html>
